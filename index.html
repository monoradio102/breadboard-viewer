<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Breadboard Viewer</title>
    <meta name="description" content="ブレッドボード上の配線をJSONで記述・共有するビューア。AIエージェントから扱いやすい形式。" />
    <link rel="stylesheet" href="src/style.css" />
    <!-- AI agents: start at llms.txt (format, single-file CLI, window.bb API) -->
    <link rel="help" type="text/plain" href="llms.txt" title="AIエージェント向けの手引き" />
  </head>
  <body>
    <header class="topbar">
      <h1>Breadboard Viewer</h1>
      <input id="title" class="title-input" placeholder="回路のタイトル" aria-label="回路のタイトル" />
      <div class="actions">
        <select id="examples" aria-label="サンプルを開く">
          <option value="">サンプルを開く…</option>
          <option value="blink-nano">Arduino Nano で Lチカ</option>
          <option value="pico-button">Pico でボタン入力とLED</option>
          <option value="motor-servo">モーターとサーボ</option>
          <option value="distance-alarm">HC-SR04 で距離アラーム</option>
          <option value="tone-speaker">スピーカーで音を鳴らす</option>
          <option value="led-burnout">抵抗なしで LED をつなぐと… (演出SVG)</option>
          <option value="oled-custom-part">カスタム部品 (OLED)</option>
        </select>
        <button id="btn-new" type="button">新規</button>
        <button id="btn-open" type="button" title="JSON または このアプリで書き出したSVG">開く</button>
        <button id="btn-save" type="button" title="回路をJSONで保存">JSON保存</button>
        <select id="export" aria-label="画像を書き出す" title="画像を書き出す (SVGには回路データも入ります)">
          <option value="">画像を書き出す…</option>
          <option value="png">PNG (透過, この瞬間)</option>
          <option value="png-white">PNG (白背景, この瞬間)</option>
          <option value="svg-still">SVG (静止画, この瞬間)</option>
          <option value="svg-anim">SVG (アニメーション)</option>
        </select>
        <input id="file" type="file" accept=".json,.svg,application/json,image/svg+xml" hidden />
        <a class="ai-link" href="llms.txt" target="_blank" rel="noopener" title="AIエージェントにこのURLを渡すと、回路を書いて描画できます">AI向け</a>
      </div>
    </header>

    <main class="layout">
      <aside class="panel parts-panel">
        <h2>部品一覧</h2>
        <div class="lib-actions" title="マイ部品: 独自部品の定義をこのブラウザに保存して使い回せます">
          <button id="btn-lib-import" type="button" title="部品ライブラリ (JSON) や回路ファイルの独自部品を読み込む">部品を読み込む</button>
          <button id="btn-lib-save" type="button" title="この回路の独自部品をマイ部品に保存">回路から保存</button>
          <button id="btn-lib-export" type="button" title="マイ部品をJSONで書き出す">書き出す</button>
          <input id="lib-file" type="file" accept=".json,.svg,application/json,image/svg+xml" multiple hidden />
        </div>
        <input id="part-filter" type="search" placeholder="絞り込み" aria-label="部品を絞り込み" />
        <div id="part-list"></div>
        <div id="part-detail" class="part-detail" hidden></div>
      </aside>

      <section class="stage-wrap">
        <div class="toolbar">
          <button id="btn-undo" type="button" title="元に戻す (Ctrl+Z)">↶</button>
          <button id="btn-redo" type="button" title="やり直し (Ctrl+Shift+Z)">↷</button>
          <label>ボード <select id="board-type"></select></label>
          <label>配線の色 <select id="wire-color"></select></label>
          <span id="player" class="player" hidden>
            <button id="btn-play" type="button" title="再生 / 一時停止 (Space)">⏸</button>
            <input id="anim-time" type="range" min="0" max="1000" value="0" aria-label="アニメーションの時刻" />
            <span id="anim-label" class="anim-label">0.0s</span>
            <label title="アニメーション1周の長さ (秒)">長さ <input id="anim-duration" type="number" min="0.1" step="0.1" value="2" />秒</label>
            <label title="繰り返し再生"><input id="anim-loop" type="checkbox" checked />ループ</label>
            <label title="キャプションを表示 (書き出す画像にも反映)"><input id="anim-captions" type="checkbox" checked />キャプション</label>
          </span>
          <span class="spacer"></span>
          <button id="btn-zoom-out" type="button" title="縮小 (ホイール)">−</button>
          <button id="btn-zoom-fit" type="button" title="全体を表示">全体</button>
          <button id="btn-zoom-in" type="button" title="拡大 (ホイール)">＋</button>
        </div>
        <div class="stage-area">
          <div id="stage" class="stage" aria-label="ブレッドボード"></div>
          <div id="caption" class="caption-layer" hidden></div>
        </div>
        <div id="status" class="status">穴にカーソルを合わせると位置とネットを表示します</div>
      </section>

      <aside class="panel editor-panel">
        <h2>選択中</h2>
        <div id="inspector" class="inspector"></div>
        <h2>回路データ (JSON)</h2>
        <textarea id="editor" spellcheck="false" aria-label="回路JSON"></textarea>
        <div id="messages" class="messages"></div>
        <h2>ネット</h2>
        <pre id="nets" class="nets"></pre>
      </aside>
    </main>

    <div id="drop-hint" class="drop-hint" hidden>JSON / SVG をドロップして読み込み</div>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
